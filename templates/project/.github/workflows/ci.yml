# __TITLE__ CI pipeline — docs/CODING_STANDARDS.md §12.6. Every gate here also runs locally with the same command.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # The godot-builds release tag; bump it together with the Godot.NET.Sdk version in __GAME__.csproj (ADR 0002).
  GODOT_VERSION: "__GODOT_RELEASE__"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The exact SDK from global.json (ADR 0002).
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build __GAME__.sln -c Debug
      # Release exports compile without the dev and test code paths; keep them building too.
      - run: dotnet build __GAME__.csproj -c ExportRelease

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: >
          dotnet test --project tests/__GAME__.Core.Tests
          --results-directory "$GITHUB_WORKSPACE/TestResults"
          --report-xunit-junit --report-xunit-junit-filename junit.xml
          --coverlet --coverlet-output-format cobertura
          --coverlet-include "[__GAME__.Core]*"
          --coverlet-threshold 85 --coverlet-threshold-type line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: TestResults/

  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet build tools/__GAME__.Wiki/__GAME__.Wiki.csproj -c Debug
      - run: >
          dotnet run --no-build --project tools/__GAME__.Wiki --
          --strict --commit "${GITHUB_SHA::8}"
          --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/"
      - run: dotnet docfx tools/wiki/docfx.json --warningsAsErrors
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/wiki/_site

  godot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Download Godot
        run: |
          GODOT_ZIP="Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${GODOT_ZIP}"
          unzip -q "$GODOT_ZIP" -d /opt/godot
          echo "GODOT_BIN=$(find /opt/godot -name 'Godot_v*_mono_linux*.x86_64' -type f | head -n1)" >> "$GITHUB_ENV"
      - run: dotnet build __GAME__.csproj -c Debug
      - name: Import, boot, and run the Godot-runtime tests
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee import.log
          "$GODOT_BIN" --headless --path . --quit-after 120 2>&1 | tee run.log
          # Once gameplay exists, also run it on the autopilot here, e.g. --quit-after 600 -- --autopilot.
          "$GODOT_BIN" --headless --path . res://tests/godot/test_runner.tscn -- --junit=godot-tests.xml 2>&1 | tee godot-tests.log
          if grep -E "^(ERROR|SCRIPT ERROR|USER ERROR)" import.log run.log; then
            echo "Godot reported errors (see above)."
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            *.log
            godot-tests.xml

  # Publishes the wiki to GitHub Pages from main only (ADR 0008). Enable Pages with "GitHub Actions" as the source,
  # and keep the repository (and so its Pages site) private if the wiki should be.
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [wiki]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
